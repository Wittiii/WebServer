rtsp: true
rtspAddress: :8554

hls: true
hlsAddress: :8888
# HLS erst bei Abruf erzeugen; die erste Wiedergabe kann dadurch länger dauern.
hlsAlwaysRemux: false

webrtc: true
webrtcAddress: :8889

api: true
apiAddress: :9997




paths:
  pi-zero-01: {}
  esp32-cam-01: {}
  dfr1154-cam-01: {}
  # Set P4_CAMERA_RTSP_URL in the MediaMTX environment, for example
  # rtsp://<camera-ip>:8554/live.  The P4 is already H264; no FFmpeg bridge.
  esp32-p4-cam-01:
    source: ${P4_CAMERA_RTSP_URL}
    sourceOnDemand: true
