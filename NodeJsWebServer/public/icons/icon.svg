<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Emerald Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Water Drop Gradient -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Tech Ring / Dashed Dial -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="14 10" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#0ea5e9" stroke-width="1.5" opacity="0.3"/>

  <!-- Hydroponic Plant Leaf (Left Branch) -->
  <path d="M 230 380 C 130 365 100 260 125 180 C 175 180 230 220 240 310 C 248 245 285 190 350 170 C 360 245 325 330 245 380 Z" 
        fill="url(#leafGrad)" filter="url(#softGlow)"/>

  <!-- Center Stem / Vein -->
  <path d="M 238 370 C 230 310 205 250 165 205" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- Solar / Electric Lightning Bolt (Overlay) -->
  <path d="M 295 130 L 210 260 L 265 260 L 225 385 L 330 240 L 275 240 Z" 
        fill="url(#boltGrad)" filter="url(#softGlow)"/>

  <!-- Subtle Core Highlight on Bolt -->
  <path d="M 288 150 L 225 248 L 268 248 L 245 345 L 312 245 L 275 245 Z" 
        fill="#ffffff" opacity="0.4"/>

  <!-- Water Drop Accent (Hydroponic Vitality) -->
  <path d="M 355 330 C 355 350 338 365 318 365 C 298 365 285 350 318 310 C 355 350 355 330 355 330 Z" 
        fill="url(#dropGrad)"/>
</svg>