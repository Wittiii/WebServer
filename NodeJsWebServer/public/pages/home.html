<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Deck - Smart IoT</title>
  <link rel="stylesheet" href="/pages/style.css">
</head>
<body class="theme-operations page-home">
  <div id="navbar"></div>

  <header class="hero">
    <div class="container hero-inner">
      <div class="hero-copy">
        <h1>Operations Deck</h1>
        <div class="hero-actions">
          <a class="btn" href="/dashboard">Dashboard oeffnen</a>
          <a class="btn btn-secondary" href="/hydroponic">Hydroponik</a>
          <div class="clock-pill">Systemzeit <span id="clock"></span></div>
        </div>
      </div>
    </div>
    <div class="container badge-strip">
      <span class="status-badge status-online"><span class="pulse-online"></span>MQTT Broker</span>
      <span class="status-badge status-online"><span class="pulse-online"></span>SQLite Logging</span>
      <span class="status-badge status-online"><span class="pulse-online"></span>Geschuetzter Zugriff</span>
    </div>
  </header>

  <main class="container page-shell">
    <div id="broker-summary" class="grid-2 summary-grid"></div>

    <div class="grid-2 feature-grid">
      <section class="panel">
        <h2>Schnellzugriff</h2>
        <div class="action-card-grid">
          <a class="action-card" href="/dashboard">
            <strong>Broker Monitor</strong>
          </a>
          <a class="action-card" href="/camera">
            <strong>Kamera Leitstand</strong>
          </a>
          <a class="action-card" href="/hydroponic">
            <strong>Hydroponik Hub</strong>
          </a>
        </div>
      </section>

      <section class="panel">
        <h2>Interaktion</h2>
        <div class="hero-actions compact-actions">
          <button id="hello-btn" type="button">Systemgruss anzeigen</button>
          <a class="btn btn-secondary" href="/login">Zum Login</a>
        </div>
      </section>
    </div>

    <section id="messages" class="panel">
      <h2>System-Nachrichten</h2>
    </section>
  </main>

  <script src="/pages/main.js"></script>
</body>
</html>
