<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Operations Deck</title>
  <link rel="stylesheet" href="/pages/style.css">
</head>
<body class="theme-operations page-dashboard">
  <div id="navbar"></div>

  <header class="hero">
    <div class="container hero-inner">
      <div class="hero-copy">
        <h1>IoT Dashboard</h1>
      </div>
    </div>
  </header>

  <main class="container page-shell dashboard-shell">
    <div class="dashboard-main">
      <div id="broker-summary" class="grid-2 summary-grid"></div>

      <div class="grid-3">
        <div class="stats-card">
          <h3>Broker Status</h3>
          <div class="stats-val"><span class="pulse-online"></span>ONLINE</div>
        </div>
        <div class="stats-card">
          <h3>Aktive Clients</h3>
          <div class="stats-val" id="stats-clients-count">0</div>
        </div>
        <div class="stats-card">
          <h3>Erfasste Topics</h3>
          <div class="stats-val" id="stats-topics-count">0</div>
        </div>
      </div>

      <section id="dashboard-server-health" class="panel">
        <h2>Server Status</h2>
        <div class="grid-2 server-health-grid">
          <div class="stats-card">
            <h3>CPU</h3>
            <div class="stats-val" id="server-cpu-usage">-</div>
            <p id="server-cpu-meta">Lade...</p>
          </div>
          <div class="stats-card">
            <h3>RAM</h3>
            <div class="stats-val" id="server-ram-usage">-</div>
            <p id="server-ram-meta">Lade...</p>
          </div>
          <div class="stats-card">
            <h3>Storage</h3>
            <div class="stats-val" id="server-storage-free">-</div>
            <p id="server-storage-meta">Lade...</p>
          </div>
          <div class="stats-card">
            <h3>Datenbank</h3>
            <div class="stats-val" id="server-db-size">-</div>
            <p id="server-db-meta">Lade...</p>
          </div>
        </div>
      </section>

      <div class="grid-2 dashboard-columns">
        <section id="mqtt-clients" class="panel">
          <h2>MQTT Clients</h2>
          <ul id="client-list" class="readings-list"></ul>
        </section>

        <section id="mqtt-topics" class="panel">
          <h2>MQTT Topics</h2>
          <ul id="topic-list" class="readings-list"></ul>
        </section>
      </div>

      <section id="dashboard-trend" class="panel">
        <h2>Trenddiagramm</h2>
        <canvas id="dashboard-trend-chart" width="900" height="260" class="readings-chart"></canvas>
      </section>
    </div>

    <aside class="dashboard-rail">
      <section id="dashboard-quick-board" class="panel">
        <h2>Schnellzugriff</h2>
        <ul id="quick-widget-list" class="quick-widget-list"></ul>
      </section>

      <section id="dashboard-quick-builder" class="panel">
        <h2>Karte anlegen</h2>
        <form id="quick-widget-form" class="quick-builder-form">
          <div class="form-group">
            <label for="quick-widget-type">Typ</label>
            <select id="quick-widget-type">
              <option value="value">Letzten Wert anzeigen</option>
              <option value="command">Befehl senden</option>
            </select>
          </div>

          <div class="form-group">
            <label for="quick-widget-object">Objekt</label>
            <select id="quick-widget-object"></select>
          </div>

          <div class="form-group">
            <label for="quick-widget-detail" id="quick-widget-detail-label">Messwert</label>
            <select id="quick-widget-detail"></select>
          </div>

          <div class="form-group">
            <label for="quick-widget-title">Eigener Titel</label>
            <input id="quick-widget-title" type="text" placeholder="Optional">
          </div>

          <div class="inline-actions">
            <button id="quick-widget-save" type="submit">Speichern</button>
            <button id="quick-widget-cancel" type="button" class="btn btn-secondary">Abbrechen</button>
          </div>
        </form>

        <p id="quick-widget-status" class="status-line"></p>
      </section>
    </aside>
  </main>

  <script src="/pages/main.js"></script>
  <script src="/pages/dashboard/dashboard.js"></script>
</body>
</html>
