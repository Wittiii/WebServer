<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Operations Deck</title>
  <link rel="stylesheet" href="/pages/style.css">
  <link rel="stylesheet" href="/pages/experience.css">
</head>
<body class="theme-operations page-login">
  <main class="container login-card">
    <section class="panel login-panel">
      <div class="login-badge"><span class="pulse-online"></span></div>
      <p class="eyebrow">Smart IoT · Geschützter Bereich</p>
      <h1>Willkommen zurück</h1>
      <p class="hero-text">Melde dich an, um deine Geräte und Anlagen zu verwalten.</p>

      <form id="login-form" method="post" action="/login">
        <div class="form-group">
          <label for="username">Nutzername</label>
          <input id="username" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Admin" required>
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder="********" required>
        </div>
        <button type="submit">Anmelden</button>
      </form>

      <p id="login-error" class="error-msg" role="alert" hidden></p>
      <a class="login-back-link" href="/">Zur Startseite</a>
    </section>
  </main>

  <script src="/pages/login/login.js"></script>
</body>
</html>
